name: portfolio:davidilie
on:
   pull_request:
      paths-ignore:
         - "**/*.md"
         - "docs/**"
   push:
      branches:
         - version6
      paths-ignore:
         - "**/*.md"
         - "docs/**"

# Supersede stale pull request runs; let every version6 build finish.
concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
   execute:
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
         IMAGE: ghcr.io/davidilie/portfolio-davidilie
      runs-on: ubuntu-24.04
      steps:
         - name: "Build:checkout"
           uses: actions/checkout@v4
         - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
           with:
              version: 10.0.0
         - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
           with:
              node-version: 22
              cache: pnpm
         - run: pnpm install --frozen-lockfile
         # The Prisma client, velite content and Next route types are generated,
         # not committed; the typecheck needs all three.
         - run: pnpm exec prisma generate
         - run: pnpm exec velite build
         - run: pnpm exec next typegen
           env:
              SKIP_ENV_VALIDATION: true
         - name: Typecheck
           run: pnpm exec tsc --noEmit

         # One build per event, after the typecheck: pull requests compile here,
         # version6 builds the image below. Both skip Next's own typecheck.
         - name: Build
           if: github.event_name == 'pull_request'
           run: pnpm build
           env:
              SKIP_ENV_VALIDATION: true
              NEXT_SKIP_TYPECHECK: "1"
              NEXT_PUBLIC_APP_URL: https://davidilie.com

         - name: Generate build ID
           if: github.event_name == 'push'
           id: prep
           run: |
              branch=${GITHUB_REF##*/}
              sha=${GITHUB_SHA::8}
              ts=$(date +%s)
              echo "BUILD_ID=${branch}-${sha}-${ts}" >> "$GITHUB_OUTPUT"
         - name: Login to GitHub Container Registry
           if: github.event_name == 'push'
           uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
           with:
              registry: ghcr.io
              username: DavidIlie
              password: ${{ secrets.TOKEN }}
         - if: github.event_name == 'push'
           uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
         # Flux deploys any pushed <branch>-<sha>-<ts> tag.
         - name: Build and publish container image with tag
           if: github.event_name == 'push'
           uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
           with:
              push: ${{ github.event_name == 'push' }}
              context: .
              file: ./Dockerfile
              tags: |
                 ${{ env.IMAGE }}:${{ steps.prep.outputs.BUILD_ID }}
              cache-from: type=gha
              cache-to: type=gha,mode=max

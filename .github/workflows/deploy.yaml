name: portfolio:davidilie
on:
   pull_request:
   push:
      branches:
         - version6

jobs:
   execute:
      # Self-hosted runner: don't run code from fork pull requests on it.
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
         IMAGE: ghcr.io/davidilie/portfolio-davidilie
      runs-on: davidapps-ubuntu
      steps:
         - name: Generate build ID
           id: prep
           run: |
              branch=${GITHUB_REF##*/}
              sha=${GITHUB_SHA::8}
              ts=$(date +%s)
              echo "BUILD_ID=${branch}-${sha}-${ts}" >> "$GITHUB_OUTPUT"
         - name: "Build:checkout"
           uses: actions/checkout@v4
         - name: Login to GitHub Container Registry
           if: github.event_name == 'push'
           uses: docker/login-action@v3
           with:
              registry: ghcr.io
              username: DavidIlie
              password: ${{ secrets.TOKEN }}
         # Pull requests only build. Flux deploys any pushed <branch>-<sha>-<ts> tag.
         # The runner's default Buildx builder is the persistent cluster BuildKit,
         # which keeps the layer cache between runs.
         - name: Build and publish container image with tag
           uses: docker/build-push-action@v6
           with:
              push: ${{ github.event_name == 'push' }}
              context: .
              file: ./Dockerfile
              tags: |
                 ${{ env.IMAGE }}:${{ steps.prep.outputs.BUILD_ID }}
